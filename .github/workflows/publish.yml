name: Publish
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Verify release version
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - run: npm ci --ignore-scripts
      - name: Verify registry signatures
        run: npm audit signatures
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Report upstream development advisories
        continue-on-error: true
        run: npm audit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm publish --ignore-scripts --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
